---
name: Build and Release Cronless

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts build-essential git

      - name: Update debian/changelog from git
        shell: bash
        run: |
          set -e

          AUTHOR="Denis <zver@altlinux.org>"
          DATE=$(date -R)

          # Определяем версию
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${CURRENT_TAG#v}"

            # Находим предыдущий тег
            LAST_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"
          else
            LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

            if [[ -n "$LAST_TAG" ]]; then
              VERSION="${LAST_TAG#v}-git$(date +%Y%m%d)"
            else
              VERSION="0.1.0-git$(date +%Y%m%d)"
            fi
          fi

          # Определяем диапазон коммитов
          if [[ -n "$LAST_TAG" ]]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          CHANGES=$(git log --pretty=format:"  * %s" $RANGE)

          # Защита от пустого changelog
          if [[ -z "$CHANGES" ]]; then
            CHANGES="  * Release $VERSION"
          fi

          CHANGES=$(git log --pretty=format:"  * %s" $RANGE)

          cat > debian/changelog <<EOF
          cronless ($VERSION) unstable; urgency=low

          $CHANGES

           -- $AUTHOR  $DATE
          EOF

          cat debian/changelog

      - name: Build deb package
        run: |
          dpkg-buildpackage -us -uc
          cp ../cronless_*.deb .

      - name: Upload deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronless-deb
          path: cronless_*.deb

  release:
    runs-on: ubuntu-latest
    needs: build-deb

    steps:
      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: cronless-deb
          path: ./dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/cronless_*_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep 5 newest)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OLD_TAGS=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r 'add | sort_by(.published_at // .created_at) | reverse | .[5:][] | .tag_name')

          if [[ -n "$OLD_TAGS" ]]; then
            while IFS= read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            done <<< "$OLD_TAGS"
          else
            echo "Nothing to delete. 5 or fewer releases."
          fi

